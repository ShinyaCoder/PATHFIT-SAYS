<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SQUIDFIT Controller</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;

            font-family: Arial, sans-serif;

            color: white;
        }

        .controller {

            width: 92%;
            max-width: 450px;

            padding: 25px;

            text-align: center;

            background: #1c1c1c;

            border: 3px solid white;

            border-radius: 20px;

            box-shadow:
                0 0 25px rgba(255,255,255,0.2);

        }

        h1 {

            margin: 0;

            font-size: 36px;

            letter-spacing: 3px;

        }

        .subtitle {

            margin-top: 8px;

            margin-bottom: 25px;

            font-size: 13px;

            letter-spacing: 3px;

            opacity: 0.6;

        }

        button {

            width: 100%;

            padding: 18px;

            margin-top: 12px;

            border: 2px solid white;

            border-radius: 12px;

            background: #292929;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }

        button:active {

            transform: scale(0.97);

        }

        .section {

            margin-top: 25px;

        }

        .label {

            margin-bottom: 10px;

            font-size: 13px;

            letter-spacing: 2px;

            opacity: 0.6;

        }

        select {

            width: 100%;

            padding: 17px;

            border-radius: 12px;

            border: 2px solid white;

            background: #292929;

            color: white;

            font-size: 16px;

            font-weight: bold;

        }

        .choice-buttons {

            display: flex;

            gap: 10px;

        }

        .choice-buttons button {

            margin-top: 0;

        }

        .selected {

            background: white;

            color: black;

        }

        .player-controls {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

        }

        .player-controls button {

            width: 65px;

            padding: 15px;

            margin-top: 0;

            font-size: 25px;

        }

        #playerCount {

            min-width: 70px;

            font-size: 35px;

            font-weight: bold;

        }

        #status {

            margin-top: 20px;

            font-size: 13px;

            opacity: 0.6;

        }

    </style>

</head>


<body>


<div class="controller">

    <h1>🦑 SQUIDFIT</h1>

    <div class="subtitle">
        GAME CONTROLLER
    </div>


    <!-- START -->

    <button id="startButton">
        ▶ START GAME
    </button>


    <!-- PATHFIT SAYS -->

    <div class="section">

        <div class="label">
            COMMAND TYPE
        </div>


        <div class="choice-buttons">

            <button id="saysButton">
                PATHFIT SAYS
            </button>

            <button id="normalButton">
                NORMAL
            </button>

        </div>

    </div>


    <!-- COMMAND -->

    <div class="section">

        <div class="label">
            CHOOSE COMMAND
        </div>


        <select id="commandSelect">

            <option value="5 SQUATS!">
                5 SQUATS!
            </option>

            <option value="HIGH KNEES!">
                HIGH KNEES!
            </option>

            <option value="CLAP 5 TIMES!">
                CLAP 5 TIMES!
            </option>

            <option value="TOUCH YOUR TOES!">
                TOUCH YOUR TOES!
            </option>

            <option value="TOUCH YOUR KNEES!">
                TOUCH YOUR KNEES!
            </option>

            <option value="JUMP 5 TIMES!">
                JUMP 5 TIMES!
            </option>

            <option value="MARCH IN PLACE!">
                MARCH IN PLACE!
            </option>

            <option value="WAVE YOUR HANDS!">
                WAVE YOUR HANDS!
            </option>


            <option value="DANCE!">
                DANCE!
            </option>

            <option value="ACT LIKE A CHICKEN!">
                ACT LIKE A CHICKEN!
            </option>

            <option value="WALK LIKE A ROBOT!">
                WALK LIKE A ROBOT!
            </option>

            <option value="POSE LIKE A SUPERHERO!">
                POSE LIKE A SUPERHERO!
            </option>

            <option value="MAKE A HEART WITH YOUR HANDS!">
                MAKE A HEART WITH YOUR HANDS!
            </option>

            <option value="SHAKE YOUR SHOULDERS!">
                SHAKE YOUR SHOULDERS!
            </option>

            <option value="FREEZE!">
                FREEZE!
            </option>


            <option value="5 LUNGES!">
                5 LUNGES!
            </option>

            <option value="3 BURPEES!">
                3 BURPEES!
            </option>

            <option value="FROG JUMP!">
                FROG JUMP!
            </option>

            <option value="CRAB WALK!">
                CRAB WALK!
            </option>

            <option value="RUN IN PLACE!">
                RUN IN PLACE!
            </option>

            <option value="STAND ON ONE LEG!">
                STAND ON ONE LEG!
            </option>

            <option value="DO 3 JUMPING JACKS!">
                DO 3 JUMPING JACKS!
            </option>

            <option value="DO 5 ARM CIRCLES!">
                DO 5 ARM CIRCLES!
            </option>


            <option value="SPIN AROUND!">
                SPIN AROUND!
            </option>

            <option value="TOUCH YOUR HEAD!">
                TOUCH YOUR HEAD!
            </option>

            <option value="TOUCH YOUR LEFT EAR!">
                TOUCH YOUR LEFT EAR!
            </option>

            <option value="TOUCH YOUR RIGHT KNEE!">
                TOUCH YOUR RIGHT KNEE!
            </option>

            <option value="RAISE BOTH HANDS!">
                RAISE BOTH HANDS!
            </option>

            <option value="CROUCH DOWN!">
                CROUCH DOWN!
            </option>

            <option value="STAND STILL!">
                STAND STILL!
            </option>


            <option value="DO 2 SQUATS!">
                DO 2 SQUATS!
            </option>

            <option value="JUMP ONCE!">
                JUMP ONCE!
            </option>

            <option value="CLAP 3 TIMES!">
                CLAP 3 TIMES!
            </option>

            <option value="TURN AROUND!">
                TURN AROUND!
            </option>

            <option value="WIGGLE YOUR ARMS!">
                WIGGLE YOUR ARMS!
            </option>

            <option value="PRETEND TO BE A FROG!">
                PRETEND TO BE A FROG!
            </option>

        </select>


        <button id="sendButton">
            📢 SEND COMMAND
        </button>

    </div>


    <!-- PLAYERS -->

    <div class="section">

        <div class="label">
            PLAYERS REMAINING
        </div>


        <div class="player-controls">

            <button id="minusPlayer">
                −
            </button>


            <div id="playerCount">
                53
            </div>


            <button id="plusPlayer">
                +
            </button>

        </div>

    </div>


    <div id="status">
        READY
    </div>

</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


// ===============================
// FIREBASE
// ===============================

const firebaseConfig = {

    apiKey:
        "AIzaSyAPAyfpSbN8RhHgenMIxFqZTQds1hjCofE",

    authDomain:
        "pathfit-says.firebaseapp.com",

    databaseURL:
        "https://pathfit-says-default-rtdb.firebaseio.com",

    projectId:
        "pathfit-says",

    storageBucket:
        "pathfit-says.firebasestorage.app",

    messagingSenderId:
        "369392989206",

    appId:
        "1:369392989206:web:ef2a369b78afb59a0bb137"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


const gameRef =
    ref(db, "game");

const playersRef =
    ref(db, "game/players");


// ===============================
// VARIABLES
// ===============================

let pathfitSays = true;

let players = 53;


// ===============================
// PATHFIT SAYS BUTTON
// ===============================

document
.getElementById("saysButton")
.addEventListener("click", () => {

    pathfitSays = true;

    document
    .getElementById("saysButton")
    .classList.add("selected");

    document
    .getElementById("normalButton")
    .classList.remove("selected");

});


// ===============================
// NORMAL BUTTON
// ===============================

document
.getElementById("normalButton")
.addEventListener("click", () => {

    pathfitSays = false;

    document
    .getElementById("normalButton")
    .classList.add("selected");

    document
    .getElementById("saysButton")
    .classList.remove("selected");

});


// ===============================
// SEND COMMAND
// ===============================

function sendCommand() {

    const command =
        document
        .getElementById("commandSelect")
        .value;


    set(gameRef, {

        command: command,

        pathfitSays: pathfitSays,

        time: Date.now()

    })

    .then(() => {

        document
        .getElementById("status")
        .innerHTML =
            "COMMAND SENT ✓";

    })

    .catch((error) => {

        console.error(error);

        document
        .getElementById("status")
        .innerHTML =
            "CONNECTION ERROR";

    });

}


// ===============================
// START GAME
// ===============================

document
.getElementById("startButton")
.addEventListener("click", () => {

    sendCommand();

    document
    .getElementById("status")
    .innerHTML =
        "GAME STARTED ✓";

});


// ===============================
// SEND BUTTON
// ===============================

document
.getElementById("sendButton")
.addEventListener(
    "click",
    sendCommand
);


// ===============================
// MINUS PLAYER
// ===============================

document
.getElementById("minusPlayer")
.addEventListener("click", () => {

    if (players > 0) {

        players--;

        document
        .getElementById("playerCount")
        .innerHTML = players;


        set(playersRef, players);

    }

});


// ===============================
// PLUS PLAYER
// ===============================

document
.getElementById("plusPlayer")
.addEventListener("click", () => {

    if (players < 53) {

        players++;

        document
        .getElementById("playerCount")
        .innerHTML = players;


        set(playersRef, players);

    }

});


console.log(
    "SQUIDFIT CONTROLLER CONNECTED!"
);

</script>


</body>

</html>
