<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SQUIDFIT</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<!-- =========================
     MAIN MENU
========================= -->

<div class="menu" id="mainMenu">

    <div class="logo">
        🦑
    </div>

    <h1>SQUIDFIT</h1>

    <h2>PATHFIT SAYS</h2>

    <div class="menu-buttons">

        <button onclick="startGame()">
            ▶ START GAME
        </button>

        <button onclick="showInstructions()">
            📖 HOW TO PLAY
        </button>

    </div>

    <p class="version">
        PATHFIT EDITION
    </p>

</div>



<!-- =========================
     GAME SCREEN
========================= -->

<div class="game-screen" id="gameScreen">

    <div class="game-header">

        <div>
            ROUND <span id="round">1</span>
        </div>

        <div>
            PLAYERS: <span id="players">53</span>
        </div>

    </div>


    <div class="command-area">

        <p id="commandPrefix">
            GET READY
        </p>

        <h1 id="command">
            READY?
        </h1>

    </div>


    <div class="game-message" id="gameMessage">
        Listen carefully...
    </div>

</div>



<!-- =========================
     FIREBASE SCRIPT
========================= -->

<script type="module" src="script.js"></script>

</body>

</html>
